[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "get-data"
version = "0.1.0"
description = "ACM 出题测试数据生成工具（Agent + FastAPI + GUI）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "ttkbootstrap>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
get-data = "main:main"
get-data-gui = "gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "server*",
    "pipeline*",
    "sandbox*",
    "utils*",
    "config*",
    "storage*",
    "knowledge*",
    "gui*",
    "runners*",
]

[tool.setuptools]
py-modules = ["main", "problem_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
